  </g>

  <g class="wolf-tail">
    <path d="M287 315c-62-8-115-30-154-65-34-31-51-66-46-97 4-28 24-49 49-53 24-4 44 10 49 31-20-9-40-5-52 11-14 19-8 47 10 73 25 35 71 63 139 83Z" fill="url(#wolf-leg)" stroke="#3c4740" stroke-width="8" stroke-linejoin="round"/>
    <path d="M112 124c-11 20-13 39-7 58 12-12 26-18 42-18-8-16-19-29-35-40Z" fill="#a13b25" opacity=".76"/>
    <path d="M157 264c-24-18-42-38-53-60m111 99c-33-12-60-28-81-49" stroke="#68736a" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  </g>

  <g class="wolf-body">
    <path d="M255 293c20-56 77-88 147-87 57-32 139-31 211 0 49 21 79 54 94 94l-14 55c-40 39-105 54-169 38-58 22-139 15-196-11-60-28-91-49-73-89Z" fill="url(#wolf-fur)" stroke="#465149" stroke-width="8" stroke-linejoin="round"/>
    <path d="M310 258c40-29 88-39 135-31m-103 58c43-21 88-26 130-19m-93 47c36-12 70-13 105-6" stroke="#849087" stroke-width="7" stroke-linecap="round" opacity=".2"/>
  </g>

  <g class="wolf-leg-near">
    <path d="M428 337c9 36 5 69-8 99l-38 25c-10 7-6 20 7 21l78-2c17 0 25-15 17-30l-12-22 17-82Z" fill="url(#wolf-leg)" stroke="#354039" stroke-width="7" stroke-linejoin="round"/>
    <path d="m394 466 16-9m10 17 15-10m12 11 14-10" stroke="#aaa087" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="wolf-leg-near">
    <path d="M636 325c21 34 31 68 27 104l-26 37c-7 10 1 21 13 18l73-27c16-6 19-22 6-34l-19-16-17-83Z" fill="url(#wolf-leg)" stroke="#354039" stroke-width="7" stroke-linejoin="round"/>
    <path d="m646 468 14-14m9 19 13-15m11 12 13-14" stroke="#aaa087" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g class="wolf-head">
    <path d="M655 277c8-38 34-70 71-91l-7-57c-2-12 8-19 18-12l41 34c35-15 72-11 102 9l-26 31c39 2 72 17 95 45 10 12 4 27-11 31l-42 9c-21 28-53 43-92 42l-58-14c-27 18-57 14-77-7Z" fill="url(#wolf-fur)" stroke="#465149" stroke-width="8" stroke-linejoin="round"/>
    <path d="M715 174c-5-30 0-54 15-75 20 21 29 45 27 72" fill="#111714" stroke="#78847a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M792 151c26-15 54-17 82-7l-30 32" fill="#111714" stroke="#78847a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M751 216c17-16 39-22 61-15" stroke="#879188" stroke-width="6" stroke-linecap="round" opacity=".32"/>
    <g class="wolf-eye" filter="url(#wolf-glow)">
      <path d="M759 196c14-12 29-12 42 0-13 12-28 12-42 0Z" fill="url(#wolf-eye)"/>
      <ellipse cx="780" cy="196" rx="3" ry="7" fill="#120b05"/>
    </g>
    <path d="M841 219c22-9 42-7 60 4l-17 14-39 1-27-10Z" fill="#151b17" stroke="#78847a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M880 227 921 237l-31 18-35-8Z" fill="#080b09" stroke="#90998f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="906" cy="238" rx="5" ry="4" fill="#303a34"/>
    <path d="M846 250c26 9 49 6 68-8l-15 25c-19 10-39 9-57-4Z" fill="#080a09" stroke="#535d55" stroke-width="4" stroke-linejoin="round"/>
    <path d="m857 253 7 14 9-6 8 15 8-15 8 6 7-15" fill="#e7dac0" stroke="#aea188" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
