<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none">
  <defs>
    <linearGradient id="wolf-fur" x1="236" y1="172" x2="776" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39433d"/>
      <stop offset=".42" stop-color="#1a211d"/>
      <stop offset="1" stop-color="#080c0a"/>
    </linearGradient>
    <linearGradient id="wolf-leg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#242c27"/>
      <stop offset="1" stop-color="#080b09"/>
    </linearGradient>
    <linearGradient id="wolf-flame" x1="170" y1="482" x2="690" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9e2118" stop-opacity="0"/>
      <stop offset=".55" stop-color="#e44920" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffbd48"/>
    </linearGradient>
    <radialGradient id="wolf-eye">
      <stop stop-color="#fff4b5"/>
      <stop offset=".38" stop-color="#ffb52f"/>
      <stop offset="1" stop-color="#de4119"/>
    </radialGradient>
    <filter id="wolf-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .wolf-body { transform-box: fill-box; transform-origin: 52% 80%; animation: wolf-bob .62s ease-in-out infinite; }
      .wolf-leg-near { transform-box: fill-box; transform-origin: 50% 8%; animation: wolf-stride-a .62s ease-in-out infinite; }
      .wolf-leg-far { transform-box: fill-box; transform-origin: 50% 8%; animation: wolf-stride-b .62s ease-in-out infinite; }
      .wolf-tail { transform-box: fill-box; transform-origin: 96% 78%; animation: wolf-tail-sway .9s ease-in-out infinite alternate; }
      .wolf-head { transform-box: fill-box; transform-origin: 12% 72%; animation: wolf-head-drive .62s ease-in-out infinite alternate; }
      .wolf-fire { transform-box: fill-box; transform-origin: 50% 100%; animation: wolf-fire-flicker .36s ease-in-out infinite alternate; }
      .wolf-eye { animation: wolf-eye-pulse 1s ease-in-out infinite alternate; }
      @keyframes wolf-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes wolf-stride-a { 0%,100% { transform: rotate(17deg); } 50% { transform: rotate(-19deg); } }
      @keyframes wolf-stride-b { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
      @keyframes wolf-tail-sway { from { transform: rotate(-3deg); } to { transform: rotate(7deg); } }
      @keyframes wolf-head-drive { from { transform: translateX(0) rotate(0); } to { transform: translateX(4px) rotate(-1deg); } }
      @keyframes wolf-fire-flicker { from { transform: scaleY(.9); opacity: .54; } to { transform: scaleY(1.08); opacity: .88; } }
      @keyframes wolf-eye-pulse { from { opacity: .72; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
    </style>
  </defs>

  <ellipse cx="500" cy="478" rx="348" ry="32" fill="#000" opacity=".5"/>

  <g class="wolf-fire" opacity=".78">
    <path d="M188 455c-24-40 23-70 5-116 40 26 34 54 57 74-4-54 39-76 30-126 47 38 36 78 69 105 17-47 56-68 50-117 53 43 43 81 65 110 24-37 22-68 12-94 60 45 39 91 75 119 29-27 36-55 31-79 44 41 50 76 24 107-84 39-322 47-418 17Z" fill="url(#wolf-flame)"/>
  </g>

  <g class="wolf-leg-far">
    <path d="M371 334c-3 39-10 70-29 98l-42 26c-10 7-5 20 7 21l77-2c17 0 26-14 19-29l-9-19 27-82Z" fill="#101613" stroke="#303a34" stroke-width="7" stroke-linejoin="round"/>
    <path d="m302 464 17-8m10 16 15-10m11 11 14-10" stroke="#9a927e" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="wolf-leg-far">
